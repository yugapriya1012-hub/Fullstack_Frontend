<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Out - Doughlightful</title>
    <link rel="stylesheet" href="../css/sellerCSS/logout.css">
    <style>
        /* Modern & Clean Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffecec; /* Brand Soft Pink */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signout-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { color: #ff4d88; margin-top: 0; }
        p { color: #666; margin-bottom: 30px; }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }
        .yes { background-color: #ff4d88; color: white; }
        .yes:hover { background-color: #e63977; }
        .no { background-color: #eee; color: #333; }
        .no:hover { background-color: #ddd; }
    </style>
</head>
<body>

<div class="signout-container">
    <div class="signout-box">
        <h2>Sign Out</h2>
        <p>Are you sure you want to Sign Out of your seller account?</p>

        <div class="btn-group">
            <button onclick="handleLogout()" class="btn yes">Yes, Sign Out</button>
            <a href="./page/seller/add_product.html" class="btn no">Cancel</a>
        </div>
    </div>
</div>

<script>
    async function handleLogout() {
        // 1. Get the seller ID from browser storage
        const sellerId = localStorage.getItem('seller_id');

        try {
            // 2. Call the FastAPI backend to log the logout action
            // We only call it if a sellerId exists to avoid errors
            if (sellerId) {
                await fetch(`http://127.0.0.1:8000/seller/logout?seller_id=${sellerId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
            }

            // 3. Clear all browser session data (CRITICAL for security)
            localStorage.removeItem('seller_id');
            localStorage.removeItem('seller_name');
            localStorage.removeItem('isLoggedIn');
            localStorage.clear(); 
            sessionStorage.clear();

            // 4. Show the Alert Message you requested
            alert("Success! Your account has been logged out.");

            // 5. Redirect to the sign-in page
            window.location.href = "../page/signin.html"; 

        } catch (error) {
            console.error("Error during logout:", error);
            
            // Fallback: Even if the server is down, clear local data and alert
            localStorage.clear();
            alert("Your account has been logged out.");
            window.location.href = "../page/signin.html";
        }
    }
</script>

</body>
</html>
