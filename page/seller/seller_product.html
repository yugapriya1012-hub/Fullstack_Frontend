<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Products - Doughlightful</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/sellerCSS/seller_prod.css">
</head>
<body>

  <div id="toast" class="toast">Product added to cart!</div>

  <header class="navbar">
    <a href="home.html" class="logo">
      <img src="/assets/logo.png" alt="Logo" width="40" height="40">
      <span>DOUGHLIGHTFUL</span>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="./add_product.html">PRODUCTS</a></li>
        <li><a href="../seller/order_management.html">ORDER MANAGEMENT</a></li>
        <li><a href="../page/profile.html">PROFILE</a></li>
      </ul>
    </nav>
  </header>

  <div class="filter-section">
    <input type="text" id="searchInput" placeholder="Search for cakes, bakers...">
    
    <select id="locationFilter">
      <option value="all">All Locations</option>
      <option value="chennai">Chennai</option>
      <option value="adyar">Adyar</option>
      <option value="Taramani">Taramani</option>
      <option value="omr">OMR</option>
    </select>

    <label>
      <input type="checkbox" id="stockFilter"> Show Out of Stock
    </label>
  </div>

  <div class="product-grid" id="productGrid">
    <div id="noResults" style="display: none;"><h3>No products found matching your criteria.</h3></div>
  </div>

<script>
let cart = JSON.parse(localStorage.getItem('cart')) || [];
let allProducts = []; 

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.style.display = 'block';
    setTimeout(() => {
        toast.style.display = 'none';
    }, 3000);
}

function updateCartUI() {
    const cartDot = document.getElementById('cartDot');
    if(cartDot) {
        cartDot.style.display = cart.length > 0 ? 'inline' : 'none';
    }
}

function highlightCart() {
    const cartWrapper = document.getElementById('cartWrapper');
    cartWrapper.classList.add('highlight-cart');
    setTimeout(() => cartWrapper.classList.remove('highlight-cart'), 500);
}

function addToCart(product) {
    const exists = cart.some(item => item.id === product.id);
    if (!exists) {
        cart.push({ ...product, quantity: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartUI();
        showToast(`${product.name} added to cart!`);
    } else {
        showToast("Item is already in your cart!");
    }
    highlightCart();
}

async function loadProducts() {
    try {
        const response = await fetch('https://fullstackapi-two.vercel.app/products/');
        allProducts = await response.json();
        displayProducts(allProducts);
    } catch (error) {
        console.error("Fetch Error:", error);
    }
}

function displayProducts(products) {
    const grid = document.getElementById('productGrid');
    const noResults = document.getElementById('noResults');
    
    grid.innerHTML = '';
    grid.appendChild(noResults);

    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const locationTerm = document.getElementById('locationFilter').value.toLowerCase();
    const showOutOfStock = document.getElementById('stockFilter').checked;

    let visibleCount = 0;

    products.forEach(product => {
        const matchesSearch = product.product_name.toLowerCase().includes(searchTerm) || 
                             product.seller_name.toLowerCase().includes(searchTerm);
        const matchesLocation = locationTerm === 'all' || product.places.toLowerCase().includes(locationTerm);
        const isOutOfStock = product.stock <= 0; 
        const shouldShow = matchesSearch && matchesLocation && (showOutOfStock || !isOutOfStock);

        if (shouldShow) {
            visibleCount++;
            const imageUrl = `https://fullstackapi-two.vercel.app/images/products/${product.image}`;
            const card = document.createElement('div');
            card.className = `product-card ${isOutOfStock ? 'out-of-stock' : ''}`;
            
            card.innerHTML = `
                <img src="${imageUrl}" alt="${product.product_name}">
                <div class="card-content">
                    <h3>${product.product_name}</h3>
                    <p>${product.description}</p>
                    <div class="price-row">
                        <span class="price">Rs.${product.price.toFixed(2)}</span>
                        <div class="seller-info">📍 ${product.places} | By ${product.seller_name}</div>
                        <button class="add-btn" ${isOutOfStock ? 'disabled' : ''}>
                            ${isOutOfStock ? 'Out of Stock' : 'Add to Cart'}
                        </button>
                    </div>
                </div>
            `;

            if (!isOutOfStock) {
                card.querySelector('.add-btn').addEventListener('click', () => {
                    addToCart({
                        id: product.id,
                        name: product.product_name,
                        price: product.price,
                        image: imageUrl,
                        seller_id: product.seller_id  
                    });
                });
            }
            grid.appendChild(card);
        }
    });

    noResults.style.display = visibleCount === 0 ? 'block' : 'none';
}

document.getElementById('searchInput').addEventListener('input', () => displayProducts(allProducts));
document.getElementById('locationFilter').addEventListener('change', () => displayProducts(allProducts));
document.getElementById('stockFilter').addEventListener('change', () => displayProducts(allProducts));

document.addEventListener('DOMContentLoaded', () => {
    loadProducts();
    updateCartUI();
});
</script>
</body>
</html>
