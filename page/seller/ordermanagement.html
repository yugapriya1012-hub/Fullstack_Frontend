<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Bakery Seller Management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff8fb; margin: 0; padding: 20px; color: #111827; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 24px rgba(255,77,136,0.12); border: 1px solid #ffd0e0; }
        h2 { color: #ff4d88; border-bottom: 2px solid #ffd0e0; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px dashed #fce4ec; }
        th { background: linear-gradient(135deg, #ff4d88 0%, #ff85a2 100%); color: white; }
        .status { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; text-transform: uppercase; }
        .pending { background: #fff9c4; color: #f57f17; }
        .accepted { background: #e8eaf6; color: #3949ab; }
        .rejected { background: #ffebee; color: #c62828; }
        .btn-update { background: linear-gradient(135deg, #ff4d88, #ff85a2); color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; margin-left: 5px; font-weight: bold; }
        select { padding: 7px; border-radius: 4px; border: 1px solid #ffd0e0; outline: none; }
    </style>
</head>
<body>
<a href="add_product.html">Back to home</a>
<div class="container">
    <h2>Bakery Orders - Seller Panel</h2>
    
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer ID</th>
                <th>Cake / Items</th>
                <th>Total Price</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="order-table-body">
            </tbody>
    </table>
</div>
<script>
    const SELLER_ID = localStorage.getItem('seller_id') || 1; 
    const API_BASE_URL = "https://fullstackapi-two.vercel.app/orders";
    window.onload = fetchOrders;
    async function fetchOrders() {
        if (!SELLER_ID || SELLER_ID === "undefined" || SELLER_ID === "null") {
            alert("Please login as a Seller to view orders!");
            window.location.href = "../signin.html";
            return;
        }
        try {
            const response = await fetch(`${API_BASE_URL}/seller/${SELLER_ID}`);
            if (!response.ok) throw new Error("Fetch failed");
            
            const ordersFromDB = await response.json();
            renderOrders(ordersFromDB);
        } catch (error) {
            console.error("Error:", error);
            alert("Backend server check pannunga!");
        }
    }
    function renderOrders(ordersList) {
        const tbody = document.getElementById('order-table-body');
        tbody.innerHTML = ''; 
        ordersList.forEach((order) => {
            const itemsDisplay = order.items.map(i => i.product_name).join(", ");
            
            const row = `
                <tr>
                    <td>#${order.id}</td>
                    <td>${order.customer_name || 'Customer ' + order.customer_id}</td>
                    <td><strong>${itemsDisplay}</strong></td>
                    <td>₹${order.total_amount}</td>
                    <td><span class="status ${order.status.toLowerCase()}">${order.status}</span></td>
                    <td>
                        <select id="status-select-${order.id}">
                            <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Accepted" ${order.status === 'Accepted' ? 'selected' : ''}>Accept</option>
                            <option value="Rejected" ${order.status === 'Rejected' ? 'selected' : ''}>Reject</option>
                            <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Complete</option> <option value="Rejected" ${order.status === 'Rejected' ? 'selected' : ''}>Reject</option>
                        </select>
                        <button class="btn-update" onclick="updateStatus(${order.id})">Update</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }
    async function updateStatus(orderId) {
        const newStatus = document.getElementById(`status-select-${orderId}`).value;
        
        try {
            const response = await fetch(`${API_BASE_URL}/${orderId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            if (response.ok) {
                alert("Order #" + orderId + " updated to " + newStatus);
                fetchOrders(); 
            }
        } catch (error) {
            alert("Update failed!");
        }
    }
</script>
</body>
</html>
