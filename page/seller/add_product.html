<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - Doughlightful</title>
    <link rel="stylesheet" href="../css/sellerCSS/add_product.css">
</head>
<body>

    <nav class="navbar">
        <a href="dashboard.html" class="nav-logo">
            <img src="../../assets/logo.png" alt="Logo">
            <span>DOUGHLIGHTFUL</span>
        </a>
        <ul class="nav-links">
            <li><a href="seller_product.html">PRODUCTS</a></li>
            <li><a href="order_management.html">ORDER MANAGEMENT</a></li>
            <li><a href="s_profile.html">PROFILE</a></li>
            <li><a href="logout.html" class="logout-btn">Sign Out</a></li>
        </ul>
    </nav>

    <div class="content">
        <div class="content-box">
            <h2> Add New Product</h2>

            <form id="productForm" class="product-form">
                <div class="form-group">
                    <label>Seller Name</label>
                    <input type="text" id="sellerId" placeholder="Your brand name" required>
                </div>

                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="productName" placeholder="e.g. Chocolate Cake" required>
                </div>

                <div class="form-group full-width">
                    <label>Description</label>
                    <textarea id="description" placeholder="Write something yummy about this product..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Price (Rs.)</label>
                    <input type="number" id="price" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Discount (%)</label>
                    <input type="number" id="discount" placeholder="0" required>
                </div> 

                <div class="form-group">
                    <label>Location / Places</label>
                    <input type="text" id="places" placeholder="e.g. Chennai, Madurai" required>
                </div>

                <div class="form-group">
                    <label>Product Image</label>
                    <input type="file" id="productImage" accept="image/*" required>
                </div>

                <button type="submit" class="submit-btn">Publish Product</button>
            </form>
        </div>
    </div>

<script>
    window.onload = function() {
        const savedName = localStorage.getItem('seller_name');
        if(savedName) document.getElementById('sellerId').value = savedName;
    }

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData();
        formData.append('seller_name', document.getElementById('sellerId').value);
        formData.append('product_name', document.getElementById('productName').value);
        formData.append('description', document.getElementById('description').value);
        formData.append('price', document.getElementById('price').value);
        formData.append('places', document.getElementById('places').value);
        formData.append('discount', document.getElementById('discount').value);
        formData.append('image', document.getElementById('productImage').files[0]);

        try {
            const response = await fetch('https://fullstackapi-two.vercel.app/products/', {
                method: 'POST',
                body: formData 
            });

            if (response.ok) {
                window.location.href = "../seller/productsucc.html";
            } else {
                const errorData = await response.json();
                alert("Error: " + (errorData.detail || "Check details"));
            }
        } catch (error) {
            alert("Server connection failed.");
        }
    });
</script>
</body>
</html>
