<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <title>Bakery Seller Management</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf8f5; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #5d4037; border-bottom: 3px solid #d7ccc8; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #8d6e63; color: white; }
        .status { padding: 5px 10px; border-radius: 20px; font-size: 0.85em; font-weight: bold; text-transform: uppercase; }
        .pending { background: #fff3cd; color: #856404; }
        .accepted { background: #e3f2fd; color: #0d47a1; }
        .rejected { background: #f8d7da; color: #721c24; }
        .btn-update { background: #6d4c41; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; margin-left: 5px;}
        select { padding: 7px; border-radius: 4px; }
    </style>
</head>
<body>
<a href="add_product.html">Back to home</a>
<div class="container">
    <h2>Bakery Orders - Seller Panel</h2>
    
    <table>
        <thead>
            <tr>
                <th>Order ID</th>
                <th>Customer ID</th>
                <th>Cake / Items</th>
                <th>Total Price</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="order-table-body">
            </tbody>
    </table>
</div>

<script>
    const SELLER_ID = localStorage.getItem('seller_id') || 1; 
    const API_BASE_URL = "https://fullstackapi-two.vercel.app/orders";

    window.onload = fetchOrders;

    async function fetchOrders() {
        try {
            const response = await fetch(`${API_BASE_URL}/seller/${SELLER_ID}`);
            if (!response.ok) throw new Error("Fetch failed");
            
            const ordersFromDB = await response.json();
            renderOrders(ordersFromDB);
        } catch (error) {
            console.error("Error:", error);
            alert("Backend server check pannunga!");
        }
    }

    function renderOrders(ordersList) {
        const tbody = document.getElementById('order-table-body');
        tbody.innerHTML = ''; 

        ordersList.forEach((order) => {
            const itemsDisplay = order.items.map(i => i.product_name).join(", ");
            
            const row = `
                <tr>
                    <td>#${order.id}</td>
                    <td>${order.customer_id}</td>
                    <td><strong>${itemsDisplay}</strong></td>
                    <td>₹${order.total_amount}</td>
                    <td><span class="status ${order.status.toLowerCase()}">${order.status}</span></td>
                    <td>
                        <select id="status-select-${order.id}">
                            <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Accepted" ${order.status === 'Accepted' ? 'selected' : ''}>Accept</option>
                            <option value="Rejected" ${order.status === 'Rejected' ? 'selected' : ''}>Reject</option>
                            <option value="Completed" ${order.status === 'Completed' ? 'selected' : ''}>Complete</option> <option value="Rejected" ${order.status === 'Rejected' ? 'selected' : ''}>Reject</option>
                        </select>
                        <button class="btn-update" onclick="updateStatus(${order.id})">Update</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    async function updateStatus(orderId) {
        const newStatus = document.getElementById(`status-select-${orderId}`).value;
        
        try {
            const response = await fetch(`${API_BASE_URL}/${orderId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });

            if (response.ok) {
                alert("Order #" + orderId + " updated to " + newStatus);
                fetchOrders(); 
            }
        } catch (error) {
            alert("Update failed!");
        }
    }
</script>

</body>
</html>
