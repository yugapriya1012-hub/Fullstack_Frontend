<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Products - Doughlightful</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../page/css/product.css">
</head>
<body>

  <div id="toast" class="toast">Product added to cart!</div>

  <header class="navbar">
    <a href="home.html" class="logo">
      <img src="../assets/logo.png" alt="Logo" width="40" height="40">
      <span>DOUGHLIGHTFUL</span>
    </a>
    <nav>
      <ul class="nav-links">
        <li><a href="home.html">HOME</a></li>
        <li><a href="product.html" class="active">PRODUCTS</a></li>
        <li id="cartWrapper"><a href="../page/cart.html">CARTS <span id="cartDot" style="color: #ff4d88; display: none;">●</span></a></li>
        <li><a href="../page/my_order.html">MY ORDERS</a></li>
        <li><a href="../page/profile.html">PROFILE</a></li>
        <li><a href="about.html">ABOUT US</a></li>
      </ul>
    </nav>
  </header>

  <div class="filter-section">
    <input type="text" id="searchInput" placeholder="Search for cakes, bakers...">
    
    <select id="locationFilter">
      <option value="all">All Locations</option>
      <option value="chennai">Chennai</option>
      <option value="adyar">Adyar</option>
      <option value="Taramani">Taramani</option>
      <option value="omr">OMR</option>
    </select>

    <label>
      <input type="checkbox" id="stockFilter"> Show Out of Stock
    </label>
  </div>

  <div class="product-grid" id="productGrid">
    <div id="noResults" style="display: none;"><h3>No products found matching your criteria.</h3></div>
  </div>

<script src="./js/product.js"></script>
</body>
</html>
