<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Doughlightful - My Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../page/css/cart.css">
</head>
<body>

<header>
    <div class="logo-section">
        <a href="home.html"><img src="../assets/logo.png" alt="Logo" /></a>
        <span class="brand">DOUGHLIGHTFUL</span>
    </div>
    <nav>
        <ul>
            <li><a href="home.html">HOME</a></li>
            <li><a href="product.html">PRODUCTS</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="profile.html">PROFILE</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2 class="cart-title">MY CART</h2>

    <div id="emptyCartMsg" style="display:none;">
        <i class="fa-solid fa-basket-shopping"></i>
        <h3>Your cart is empty!</h3>
        <p><a href="product.html">Start Shopping</a></p>
    </div>

    <div id="cartItemsContainer"></div>

    <div class="cart-summary" id="cartSummary" style="display:none;">
        <span class="total-label">TOTAL</span>
        <span class="total-amount" id="totalAmount">Rs. 0</span>
    </div>

    <button class="checkout-btn" id="placeOrderBtn">
        <i class="fa-solid fa-bag-shopping" style="margin-right:8px;"></i> PLACE ORDER
    </button>
</main>

<div id="toast"></div>

<script>
    const BACKEND = 'https://fullstackapi-two.vercel.app/';
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function showToast(msg, duration = 3000) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
    }

    function calcTotal() {
        return cart.reduce((sum, item) => {
            const price = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
            return sum + price * item.quantity;
        }, 0);
    }

    function renderCart() {
        const container = document.getElementById('cartItemsContainer');
        const emptyMsg  = document.getElementById('emptyCartMsg');
        const summary   = document.getElementById('cartSummary');
        const totalEl   = document.getElementById('totalAmount');
        container.innerHTML = '';
        if (cart.length === 0) {
            emptyMsg.style.display = 'block';
            summary.style.display  = 'none';
            return;
        }
        emptyMsg.style.display = 'none';
        summary.style.display  = 'flex';
        cart.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${item.image}" alt="${item.name}" onerror="this.src='../assets/logo.png'"/>
                <div class="details">
                    <h4>${item.name}</h4>
                    <p>Rs. ${item.price}</p>
                    <button onclick="removeItem(${item.id})">REMOVE</button>
                </div>
                <div class="actions">
                    <button onclick="changeQty(${item.id}, -1)">−</button>
                    <span>${item.quantity}</span>
                    <button onclick="changeQty(${item.id}, 1)">+</button>
                </div>
            `;
            container.appendChild(card);
        });
        totalEl.textContent = 'Rs. ' + calcTotal().toFixed(2);
    }

    function changeQty(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.quantity += delta;
            if (item.quantity < 1) removeItem(id);
            else updateCart();
        }
    }

    function removeItem(id) {
        cart = cart.filter(i => i.id !== id);
        updateCart();
        showToast('Item removed from cart');
    }

    function updateCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    function isLoggedIn() {
        return localStorage.getItem('pEmail') !== null;
    }

    async function placeOrder() {
        if (cart.length === 0) {
            showToast('Your cart is empty!');
            return;
        }

        // Step 1: Login check
        if (!isLoggedIn()) {
            showToast('Please login first. Redirecting...');
            setTimeout(() => window.location.href = '../page/signin.html', 1800);
            return;
        }

        
        let customerId = localStorage.getItem('customer_id');

        if (!customerId) {
            const email = localStorage.getItem('pEmail');
            showToast('Verifying account...');
            try {
               
                const res = await fetch(`${BACKEND}/customers/by-email?email=${encodeURIComponent(email)}`);
                if (res.ok) {
                    const customer = await res.json();
                    customerId = customer.id || customer.customer_id;
                    localStorage.setItem('customer_id', customerId);
                } else {
                    
                    window.location.href = '../page/order.html';
                    return;
                }
            } catch (err) {
                console.warn('Backend error:', err);
                window.location.href = '../page/order.html';
                return;
            }
        }

        // Step 3: Order place பண்ணு
        const orderData = {
            customer_id: parseInt(customerId),
            items: cart.map(item => ({
                product_id: item.id,
                quantity: item.quantity
            }))
        };

        try {
            showToast('Placing your order...');
            const response = await fetch(`${BACKEND}/orders/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });

            if (response.ok) {
                const result = await response.json();
                localStorage.setItem('current_order_id', result.id);
                window.location.href = '../page/order.html';
            } else {
                const err = await response.text();
                console.error('Order error:', err);
                showToast('Could not place order. Please try again.');
            }
        } catch (error) {
            console.error('Server error:', error);
            showToast('Cannot connect to server. Is it running?');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderCart();
        document.getElementById('placeOrderBtn').addEventListener('click', placeOrder);
    });
</script>
</body>
</html>
