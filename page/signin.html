<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doughlightful - Sign In</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../page/css/signin.css">

</head>
<body>

<header>
  <div class="logo">
    <a href="home.html"><img src="../assets/logo.png" alt="Logo"></a>
    <h1>DOUGHLIGHTFUL</h1>
  </div>
</header>

<main>
  <div class="auth-box">
    <h2 id="formTitle">Customer Sign In</h2>
    <p class="subtitle">Welcome back to the community</p>

    <div class="toggle-container" id="roleToggle">
      <div id="customerTab" class="active-text">Customer</div>
      <div id="bakerTab">Baker</div>
      <span class="slider"></span>
    </div>

    <form id="signinForm">
      <input type="hidden" id="userRole" value="customer">

      <label>Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>

      <button type="submit" class="btn" id="submitBtn">Sign In</button>
    </form>

    <p class="footer-text">Don't have an account? <a href="../page/signup.html"><b>Sign Up</b></a></p>
  </div>
</main>

<script src="../page/js/signin.js"></script>
</body>
</html>
