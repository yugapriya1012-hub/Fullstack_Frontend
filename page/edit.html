<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Doughlightful</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../page/css/edit.css">
</head>
<body>

<div class="box">
    <h3>Edit Profile</h3>
    
    <div class="image-upload">
        <img id="previewImg" src="pro.jpg" alt="Profile Preview">
        <input type="file" id="imgInput" accept="image/*" style="margin-top: 10px; font-size: 0.8rem;">
    </div>
    
    <div class="input-group">
        <div class="label">Full Name</div>
        <input type="text" id="editName" placeholder="Enter your name">
    </div>

    <div class="input-group">
        <div class="label">Email Address</div>
        <input type="email" id="editEmail" placeholder="Enter your email">
    </div>

    <div class="input-group">
        <div class="label">Bio</div>
        <textarea id="editBio" rows="3" placeholder="Tell us about yourself"></textarea>
    </div>

    <button class="save-btn" onclick="saveProfile()">
        <i class="fa-solid fa-check"></i> Save Changes
    </button>
    
    <a href="profile.html" class="cancel-link">Cancel</a>
</div>

<script>
   
    window.onload = function() {
        document.getElementById('editName').value = localStorage.getItem('pName') || "";
        document.getElementById('editEmail').value = localStorage.getItem('pEmail') || "";
        document.getElementById('editBio').value = localStorage.getItem('pBio') || "";
        document.getElementById('previewImg').src = localStorage.getItem('pImg') || "pro.jpg";
    };

   
    document.getElementById('imgInput').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = function() {
            document.getElementById('previewImg').src = reader.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function saveProfile() {
        const newName = document.getElementById('editName').value;
        const newEmail = document.getElementById('editEmail').value;
        const newBio = document.getElementById('editBio').value;
        const newImg = document.getElementById('previewImg').src;

      
        localStorage.setItem('pName', newName);
        localStorage.setItem('pEmail', newEmail);
        localStorage.setItem('pBio', newBio);
        localStorage.setItem('pImg', newImg);

        alert("Profile updated successfully!");
        window.location.href = 'profile.html'; 
    }
</script>
</body>
</html>
