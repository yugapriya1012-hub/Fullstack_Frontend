<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doughlightful Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../page/css/signup.css">
</head>
<body>

  <header>
    <div class="logo">
      <a href="home.html"><img src="../assets/logo.png" alt="Logo" /></a>
      <h1>DOUGHLIGHTFUL</h1>
    </div>
  </header>

  <main>
    <div class="signin-box">
      <h2 id="formTitle">Customer Sign Up</h2>
      <p class="subtitle">Welcome to the Doughlightful community</p>
      
      <div class="toggle-container" id="roleToggle">
        <div id="customerTab" class="active-text">Customer</div>
        <div id="bakerTab">Baker</div>
        <span class="slider"></span>
      </div>

      <form id="signupForm">
        <input type="hidden" id="userRole" name="role" value="customer">

        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your name" required />

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your valid email" required />

        <label>Phone Number</label>
        <input type="tel" id="phoneNumber" placeholder="Enter phone number" required />

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
        
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password" required />

        <button type="submit" class="form-button" id="submitBtn">Create Customer Account</button>
      </form>

      <a href="home.html" class="guest">Continue as guest</a>
      <p>Already have an account? <a href="../page/signin.html" class="switch-link"><b>Sign In</b></a></p>
    </div>
  </main>

  <script src="../page/js/signup.js"></script>
</body>
</html>
