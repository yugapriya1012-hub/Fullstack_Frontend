<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Doughlightful - Order Checkout</title>
    <link rel="stylesheet" href="../page/css/cart.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #fff8fb; }
        .order-container { max-width: 500px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 14px; box-shadow: 0 5px 20px rgba(255,77,136,0.10); }
        h2 { text-align: center; color: #ff4d88; margin-bottom: 24px; font-size: 1.5rem; letter-spacing: 2px; }
        .summary-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; font-size: 0.95rem; color: #444; }
        .total-row { font-weight: bold; color: #ff4d88; font-size: 1.2rem; margin-top: 10px; border-bottom: none; }
        .delivery-section { margin-top: 24px; }
        .delivery-section label { font-weight: 600; color: #555; font-size: 0.95rem; }
        .delivery-section input { width: 100%; padding: 10px 14px; margin-top: 8px; border: 1.5px solid #ffd0e0; border-radius: 8px; font-size: 0.95rem; outline: none; }
        .delivery-section input:focus { border-color: #ff4d88; }
        .confirm-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff4d88, #ff85a2); color: white; border: none; border-radius: 50px; font-size: 1rem; font-weight: 800; letter-spacing: 1px; cursor: pointer; margin-top: 28px; box-shadow: 0 6px 20px rgba(255,77,136,0.30); transition: transform 0.15s, box-shadow 0.15s; }
        .confirm-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,77,136,0.40); }
        .confirm-btn:active { transform: translateY(0); }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="order-container">
    <h2>📦 FINAL ORDER SUMMARY</h2>
    <div id="orderItems"></div>
    <div style="margin-top: 16px;">
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">Rs. 0</span></div>
        <div class="summary-row"><span>Delivery Fee</span><span>Rs. 50</span></div>
        <div class="summary-row total-row"><span>Total Amount</span><span id="grandTotal">Rs. 0</span></div>
    </div>
    <div class="delivery-section">
        <label>Delivery Date:</label>
        <input type="date" id="deliveryDate">
    </div>
  
  <button class="confirm-btn" id="confirmBtn">
      CONFIRM & PROCEED TO PAYMENT
  </button>
  <button id="whatsappBtn" style="display:none; background:#25D366; color:white; padding:14px; border-radius:50px; width:100%; border:none; margin-top:10px; cursor:pointer; font-weight:bold; font-size:1rem;">
      💬 Contact Seller on WhatsApp
  </button>
  </div>

<div id="toast"></div>
<script>
    const BACKEND = 'https://fullstackapi-two.vercel.app/';

    function showToast(msg, duration = 3000) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
    }

    function initPage() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const itemsDiv = document.getElementById('orderItems');
        let subtotal = 0;

        if (cart.length === 0) {
            itemsDiv.innerHTML = '<p style="text-align:center;color:#aaa;padding:20px;">No items in cart</p>';
            return;
        }

        itemsDiv.innerHTML = cart.map(item => {
            subtotal += item.price * item.quantity;
            return `<div class="summary-row">
                <span>${item.name} (x${item.quantity})</span>
                <span>Rs. ${item.price * item.quantity}</span>
            </div>`;
        }).join('');

        document.getElementById('subtotal').innerText = 'Rs. ' + subtotal;
        document.getElementById('grandTotal').innerText = 'Rs. ' + (subtotal + 50);

        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('deliveryDate').value = tomorrow.toISOString().split('T')[0];
        document.getElementById('deliveryDate').min = tomorrow.toISOString().split('T')[0];

      
        const sellerId = cart[0].seller_id;
        if (sellerId) {
            loadSellerWhatsApp(sellerId);
        }
    }

    async function loadSellerWhatsApp(sellerId) {
        try {
            const res = await fetch(`${BACKEND}/seller/${sellerId}/phone`);
            if (res.ok) {
                const data = await res.json();
                const phone = "91" + data.phone;
                const message = `Hi ${data.name}! I have a doubt about my order.`;
                const btn = document.getElementById('whatsappBtn');
                btn.style.display = 'block';
                btn.onclick = () => window.open(
                    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
                    '_blank'
                );
            }
        } catch (err) {
            console.error('Seller fetch error:', err);
        }
    }

    async function processOrder() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const delDate = document.getElementById('deliveryDate').value;

        if (cart.length === 0) {
            showToast('Your cart is empty!');
            return;
        }

        if (!delDate) {
            showToast('Please select a delivery date!');
            return;
        }

        const email = localStorage.getItem('pEmail');

        if (!email) {
            showToast('Please login first! Redirecting...');
            setTimeout(() => window.location.href = '../page/signin.html', 1800);
            return;
        }

        let customerId = localStorage.getItem('customer_id');

        if (!customerId) {
            try {
                showToast('Verifying account...');
                const res = await fetch(`${BACKEND}/customers/by-email?email=${encodeURIComponent(email)}`);
                if (res.ok) {
                    const customer = await res.json();
                    customerId = customer.id || customer.customer_id;
                    localStorage.setItem('customer_id', customerId);
                } else {
                    showToast('Account is not verify');
                    return;
                }
            } catch (err) {
                console.error('Error:', err);
                showToast('Server is not connected!');
                return;
            }
        }

        // const payload = {
        //     customer_id: parseInt(customerId),
        //     items: cart.map(i => ({ product_id: i.id, quantity: i.quantity })),
        //     delivery_date: delDate
        // };
        const payload = {
        customer_id: parseInt(customerId),
        seller_id: cart[0].seller_id,
        items: cart.map(i => ({
            product_id: i.id,
            quantity: i.quantity
        })),
        delivery_date: delDate
};
        try {
            showToast('Placing your order...');
            const response = await fetch(`${BACKEND}/orders/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('last_order_id', data.id);
                localStorage.setItem('selectedDeliveryDate', delDate);
                localStorage.removeItem('cart');
                showToast('Order placed successfully!');
                setTimeout(() => window.location.href = 'upi.html', 1500);
            } else {
                const err = await response.text();
                console.error('Order error:', err);
                showToast('Order is not saved. Try again.');
            }
        } catch (e) {
            console.error('Server error:', e);
            showToast('Server connect aagala!');
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        initPage();
        document.getElementById('confirmBtn').addEventListener('click', processOrder);
    });
</script>
</body>
</html>
