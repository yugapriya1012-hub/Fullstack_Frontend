<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Doughlightful - My Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #fff8fb; color: #333; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 14px 40px; background: #fff; box-shadow: 0 2px 8px rgba(255,77,136,0.08); position: sticky; top: 0; z-index: 100; }
        .logo-section { display: flex; align-items: center; gap: 10px; }
        .logo-section img { height: 42px; object-fit: contain; }
        .brand { font-size: 1.3rem; font-weight: 800; color: #ff4d88; letter-spacing: 2px; }
        nav ul { display: flex; list-style: none; gap: 28px; }
        nav ul li a { text-decoration: none; color: #555; font-weight: 600; font-size: 0.88rem; letter-spacing: 1px; transition: color 0.2s; }
        nav ul li a:hover { color: #ff4d88; }
        main { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }
        .cart-title { text-align: center; font-size: 1.8rem; font-weight: 800; color: #ff4d88; letter-spacing: 3px; margin-bottom: 36px; }
        #emptyCartMsg { text-align: center; padding: 70px 20px; color: #aaa; }
        #emptyCartMsg i { font-size: 3.5rem; margin-bottom: 16px; display: block; }
        #emptyCartMsg h3 { font-size: 1.3rem; margin-bottom: 10px; color: #bbb; }
        #emptyCartMsg a { color: #ff4d88; font-weight: 600; text-decoration: none; }
        .product-card { display: flex; align-items: center; gap: 20px; background: #fff; border-radius: 14px; padding: 18px 22px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(255,77,136,0.07); transition: box-shadow 0.2s; }
        .product-card:hover { box-shadow: 0 4px 20px rgba(255,77,136,0.14); }
        .product-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 2px solid #ffe0ec; }
        .details { flex: 1; }
        .details h4 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; color: #222; }
        .details p { color: #ff4d88; font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
        .details button { background: none; border: 1.5px solid #ff4d88; color: #ff4d88; padding: 4px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; transition: all 0.2s; }
        .details button:hover { background: #ff4d88; color: #fff; }
        .actions { display: flex; align-items: center; gap: 10px; }
        .actions button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #ff4d88; background: #fff; color: #ff4d88; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .actions button:hover { background: #ff4d88; color: #fff; }
        .actions span { font-weight: 700; font-size: 1rem; min-width: 20px; text-align: center; }
        .cart-summary { background: #fff; border-radius: 14px; padding: 22px 28px; margin-top: 28px; box-shadow: 0 2px 12px rgba(255,77,136,0.07); display: flex; justify-content: space-between; align-items: center; }
        .cart-summary .total-label { font-size: 1rem; color: #888; font-weight: 600; }
        .cart-summary .total-amount { font-size: 1.5rem; font-weight: 800; color: #ff4d88; }
        .checkout-btn { display: block; width: 100%; max-width: 340px; margin: 30px auto 0; padding: 16px; font-size: 1rem; font-weight: 800; letter-spacing: 2px; background: linear-gradient(135deg, #ff4d88, #ff85a2); color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 20px rgba(255,77,136,0.30); transition: transform 0.15s, box-shadow 0.15s; }
        .checkout-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,77,136,0.40); }
        .checkout-btn:active { transform: translateY(0); }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 999; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<header>
    <div class="logo-section">
        <a href="home.html"><img src="../assets/logo.png" alt="Logo" /></a>
        <span class="brand">DOUGHLIGHTFUL</span>
    </div>
    <nav>
        <ul>
            <li><a href="home.html">HOME</a></li>
            <li><a href="product.html">PRODUCTS</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="profile.html">PROFILE</a></li>
        </ul>
    </nav>
</header>

<main>
    <h2 class="cart-title">MY CART</h2>

    <div id="emptyCartMsg" style="display:none;">
        <i class="fa-solid fa-basket-shopping"></i>
        <h3>Your cart is empty!</h3>
        <p><a href="product.html">Start Shopping</a></p>
    </div>

    <div id="cartItemsContainer"></div>

    <div class="cart-summary" id="cartSummary" style="display:none;">
        <span class="total-label">TOTAL</span>
        <span class="total-amount" id="totalAmount">Rs. 0</span>
    </div>

    <button class="checkout-btn" id="placeOrderBtn">
        <i class="fa-solid fa-bag-shopping" style="margin-right:8px;"></i> PLACE ORDER
    </button>
</main>

<div id="toast"></div>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function getCustomerId() {
        const possibleKeys = [
            'customer_id', 'customerId', 'user_id', 'userId',
            'id', 'loggedInUser', 'uid', 'user'
        ];
        for (const key of possibleKeys) {
            const val = localStorage.getItem(key);
            if (val) {
                try {
                    const parsed = JSON.parse(val);
                    if (parsed && typeof parsed === 'object') {
                        return parsed.customer_id || parsed.id || parsed.user_id || null;
                    }
                } catch (e) {
                    return val;
                }
            }
        }
        return null;
    }

    function showToast(msg, duration = 3000) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), duration);
    }

    function calcTotal() {
        return cart.reduce((sum, item) => {
            const price = parseFloat(String(item.price).replace(/[^0-9.]/g, '')) || 0;
            return sum + price * item.quantity;
        }, 0);
    }

    function renderCart() {
        const container = document.getElementById('cartItemsContainer');
        const emptyMsg  = document.getElementById('emptyCartMsg');
        const summary   = document.getElementById('cartSummary');
        const totalEl   = document.getElementById('totalAmount');
        container.innerHTML = '';
        if (cart.length === 0) {
            emptyMsg.style.display = 'block';
            summary.style.display  = 'none';
            return;
        }
        emptyMsg.style.display = 'none';
        summary.style.display  = 'flex';
        cart.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <img src="${item.image}" alt="${item.name}" onerror="this.src='../assets/logo.png'"/>
                <div class="details">
                    <h4>${item.name}</h4>
                    <p>Rs. ${item.price}</p>
                    <button onclick="removeItem(${item.id})">REMOVE</button>
                </div>
                <div class="actions">
                    <button onclick="changeQty(${item.id}, -1)">−</button>
                    <span>${item.quantity}</span>
                    <button onclick="changeQty(${item.id}, 1)">+</button>
                </div>
            `;
            container.appendChild(card);
        });
        totalEl.textContent = 'Rs. ' + calcTotal().toFixed(2);
    }

    function changeQty(id, delta) {
        const item = cart.find(i => i.id === id);
        if (item) {
            item.quantity += delta;
            if (item.quantity < 1) removeItem(id);
            else updateCart();
        }
    }

    function removeItem(id) {
        cart = cart.filter(i => i.id !== id);
        updateCart();
        showToast('Item removed from cart');
    }

    function updateCart() {
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    async function goToOrderPage() {
        if (cart.length === 0) {
            showToast('Your cart is empty!');
            return;
        }

        const customerId = getCustomerId();

        if (!customerId) {
            showToast('Please login to place an order. Redirecting...');
            setTimeout(() => window.location.href = '../page/signin.html', 1800);
            return;
        }

        const orderData = {
            customer_id: parseInt(customerId),
            items: cart.map(item => ({
                product_id: item.id,
                quantity: item.quantity
            }))
        };

        try {
            const response = await fetch('https://fullstackapi-two.vercel.app/orders/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });
            if (response.ok) {
                const result = await response.json();
                localStorage.setItem('current_order_id', result.id);
                window.location.href = '../page/order.html';
            } else {
                const err = await response.text();
                console.error('Order error:', err);
                showToast('Could not place order. Please try again.');
            }
        } catch (error) {
            console.error('Server error:', error);
            showToast('Cannot connect to server. Is it running?');
        }
    }

    // ✅ addEventListener — proper way, no onclick in HTML
    document.addEventListener('DOMContentLoaded', () => {
        renderCart();
        document.getElementById('placeOrderBtn').addEventListener('click', goToOrderPage);
    });
</script>
</body>
</html>
