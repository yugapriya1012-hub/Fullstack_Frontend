<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doughlightful | Home</title>
  <link rel="stylesheet" href="page/css/index.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  
  <header>
    <div class="logo-container">
      <img src="./assets/logo.png" alt="Doughlightful Logo" class="logo" />
      <h1 class="brand-name">DOUGHLIGHTFUL</h1>
    </div>

     <nav>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">HOME</a></li>
        <li><a href="page/product.html" class="nav-link">PRODUCTS</a></li>
        <li><a href="page/recipe.html" class="nav-link">RECIPES</a></li>
        <li><a href="page/about.html" class="nav-link">ABOUT US</a></li>
      </ul>
    </nav>
  </header>
  
  <section class="hero">
    <div class="hero-text">
      <h1>WELCOME TO <br><span>DOUGHLIGHTFUL</span></h1>
      <div class="buttons">
        <a href="page/signin.html" class="btn">sign.in</a>
        <a href="page/signup.html" class="btn">sign.up</a>
      </div>
      <p>
        Discover the joy of homemade bakery treats crafted with love by talented
        home bakers in your community.
      </p>
    </div>

    <div class="hero-image">
      <img src="https://i.pinimg.com/1200x/35/b4/d8/35b4d8ce2640a9e7cf0d29672358a89c.jpg" alt="Delightful Cake" />
    </div>
  </section>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {     
        const navLinks = document.querySelectorAll('.nav-link');
        
      
        function checkLoginStatus() {
           
            return localStorage.getItem('user_token') !== null;
        }

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                
                if (!checkLoginStatus()) {
                    e.preventDefault(); 
                    alert("Please log in first to view this page.");
                    window.location.href = "page/signin.html";
                }
            });
        });
    });
  </script>
</html>
